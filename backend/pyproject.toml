[project]
name = "backend"
version = "0.1.0"
description = "Add del proyecto NovaShop"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy",
    "psycopg[binary]",
    "pydantic-settings",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "src"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff.lint]
ignore = ["B008"]