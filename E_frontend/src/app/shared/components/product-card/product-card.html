<div class="card product-card h-100 shadow-sm">

    <a [routerLink]="['/product', product().id]">
        <img
        [src]="product().image"
        [alt]="product().name"
        class="card-img-top">
    </a>

    <div class="card-body d-flex flex-column">
        <a class="text-decoration-none text-dark" [routerLink]="['/product', product().id]">
            <h5 class="card-title">
                {{ product().name }}
            </h5>
        </a>
        
        <p class="rating">
            ⭐ {{ product().rating }}
        </p>

        @if(product().oldPrice){
            <p class="old-price">
                {{ product().oldPrice | currency:'COP':'symbol':'1.0-0' }}
            </p>
        }

        <h4 class="price">
            {{ product().price | currency:'COP':'symbol':'1.0-0' }}
        </h4>

        <button class="btn btn-primary mt-auto">
            <i class="bi bi-cart-plus"></i>
            Agregar al carrito
        </button>
    </div>
</div>
