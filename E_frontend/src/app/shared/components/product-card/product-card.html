<div class="card product-card h-100 shadow-sm">
    <div class="position-relative">
        <a [routerLink]="['/product', product().id]">
            <img [src]="product().image" [alt]="product().name" class="card-img-top">
        </a>
        <button type="button" class="btn btn-light favorite-button" (click)="toggleFavorite()" [attr.aria-label]="isFavorite() ? 'Quitar de favoritos' : 'Agregar a favoritos'">
            @if (isFavorite()) {
                <i class="bi bi-heart-fill text-danger"></i>
            }
            @else {
                <i class="bi bi-heart"></i>
            }
        </button>
    </div>
    <div class="card-body d-flex flex-column">
        <a class="text-decoration-none text-dark" [routerLink]="['/product', product().id]">
            <h5 class="card-title">
                {{ product().name }}
            </h5>
        </a>
        <p class="rating">
            ⭐ {{ product().rating }}
        </p>
        @if (product().oldPrice) {
            <p class="old-price">
                {{ product().oldPrice | currency:'COP':'symbol':'1.0-0' }}
            </p>
        }
        <h4 class="price">
            {{ product().price | currency:'COP':'symbol':'1.0-0' }}
        </h4>
        <button class="btn btn-primary mt-auto w-100" (click)="addToCart()">
            <i class="bi bi-cart-plus-fill me-2"></i>
            Agrear al carrito
        </button>
    </div>
</div>
