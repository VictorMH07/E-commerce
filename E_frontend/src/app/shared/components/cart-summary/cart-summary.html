<div class="summary shadow-sm">
    <h4>
        Resumen del pedido
    </h4>

    <hr>

    <div class="d-flex justify-content-between">
        <span>Productos</span>
        <strong>
            {{ cartService.totalItems() }}
        </strong>
    </div>
    <div class="d-flex justify-content-between mt-3">
        <span>Subtotal</span>
        <strong>
            {{ cartService.totalPrice() | currency:'COP':'symbol':'1.0-0' }}
        </strong>
    </div>
    <div class="d-flex justify-content-between mt-3">
        <span>Envío</span>
        <strong class="text-success">
            Gratis
        </strong>
    </div>

    <hr>

    <div class="d-flex justify-content-between">
        <h5>Total</h5>
        <h5>
            {{ cartService.totalPrice() | currency:'COP':'symbol':'1.0-0' }}
        </h5>
    </div>
    <a routerLink="/checkout" class="btn btn-primary w-100 mt-4">
        Continuar con el Checkout
    </a>
</div>
