<div class="cart-summary card shadow-sm">
    <div class="card-body">
        <h4 class="fw-bold mb-4">
            Resumen del pedido
        </h4>

        <!-- Subtotal -->
        <div class="summary-row">
            <span>
                Subtotal
            </span>
            <span>
                {{ cartService.totalPrice() | currency:'COP':'symbol':'1.0-0' }}
            </span>
        </div>

        <!-- Envio -->
        <div class="summary-row">
            <span>
                Envio
            </span>
            <span>
                {{ shipping | currency:'COP':'symbol':'1.0-0' }}
            </span>
        </div>

        <hr>

        <!-- Total -->
        <div class="summary-row total">
            <span>
                Total
            </span>
            <span>
                {{ total | currency:'COP':'symbol':'1.0-0' }}
            </span>
        </div>

        <!-- Checkout -->
        @if (cartService.totalItems() > 0) {
            <a routerLink="/checkout" class="btn btn-primary w-100 mt-4">
                <i class="bi bi-credit-card me-2"></i>
                Proceder al pago
            </a>
        }
        @else {
            <button class="btn btn-secondary w-100 mt-4" disabled>
                Carro vacio
            </button>
        }
    </div>
</div>
