<div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-indicators">
        <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="2"></button>
    </div>

    <div class="carousel-inner">

        <div class="carousel-item active">
            <img
                src="images/banners/laptop.jpg"
                class="d-block w-100"
                alt="Tecnología">

            <div class="carousel-caption">
                <h1>Bienvenido a NovaShop</h1>
                <p>Descubre los mejores productos al mejor precio.</p>

                <button class="btn btn-primary btn-lg">
                Comprar ahora
                </button>
            </div>
        </div>

        <div class="carousel-item">
            <img src="images/banners/compras.jpg"
                class="d-block w-100"
                alt="Ofertas">

            <div class="carousel-caption">
                <h1>Ofertas Especiales</h1>
                <p>Hasta 50% de descuento en productos seleccionados.</p>
            </div>
        </div>

        <div class="carousel-item">
            <img src="images/banners/gadget.jpg"
                class="d-block w-100"
                alt="Tecnología">

            <div class="carousel-caption">
                <h1>Tecnología para todos</h1>
                <p>Celulares, computadores y accesorios.</p>
            </div>
        </div>

    </div>

    <button class="carousel-control-prev"
        type="button"
        data-bs-target="#heroCarousel"
        data-bs-slide="prev">

        <span class="carousel-control-prev-icon"></span>

    </button>

    <button class="carousel-control-next"
        type="button"
        data-bs-target="#heroCarousel"
        data-bs-slide="next">

        <span class="carousel-control-next-icon"></span>
    </button>
</div>
